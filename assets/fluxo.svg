<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Como o robo opera a tela: ler, decidir, agir e conferir, em ciclo">
  <defs>
    <linearGradient id="red2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0566B"/>
      <stop offset="1" stop-color="#D10524"/>
    </linearGradient>
    <filter id="cardshadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#8A3A44" flood-opacity="0.12"/>
    </filter>
    <style>
      .sans { font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
      .title { font-weight: 700; fill: #1B1417; }
      .body  { font-weight: 400; fill: #6E5E61; }
      .num   { font-weight: 800; fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="1200" height="360" fill="#FBF7F7"/>
  <text x="48" y="48" class="sans title" font-size="24">Como o rob&#244; opera a tela</text>
  <text x="48" y="74" class="sans body" font-size="15">O mesmo ciclo serve para qualquer rotina do ERP &#8212; relat&#243;rios s&#227;o s&#243; uma delas.</text>

  <!-- arrows between cards -->
  <g fill="#D10524" stroke="#D10524" stroke-width="3">
    <path d="M300 170 h30"/>
    <path d="M334 170 l-10 -6 v12 z" stroke="none"/>
    <path d="M584 170 h30"/>
    <path d="M618 170 l-10 -6 v12 z" stroke="none"/>
    <path d="M868 170 h30"/>
    <path d="M902 170 l-10 -6 v12 z" stroke="none"/>
  </g>

  <!-- Card 1: Ler a tela -->
  <g class="sans">
    <rect x="48" y="96" width="250" height="160" rx="14" fill="#FFFFFF" stroke="#EADFE1" stroke-width="1.5" filter="url(#cardshadow)"/>
    <circle cx="80" cy="130" r="17" fill="url(#red2)"/>
    <text x="80" y="137" class="num" font-size="18" text-anchor="middle">1</text>
    <text x="110" y="137" class="title" font-size="20">Ler a tela</text>
    <ellipse cx="262" cy="128" rx="14" ry="9" fill="none" stroke="#E3B8BF" stroke-width="2"/>
    <circle cx="262" cy="128" r="3.5" fill="#E3B8BF"/>
    <text x="72" y="178" class="body" font-size="15">O rob&#244; enxerga a janela</text>
    <text x="72" y="200" class="body" font-size="15">do ERP: grade, campos,</text>
    <text x="72" y="222" class="body" font-size="15">bot&#245;es e mensagens.</text>
  </g>

  <!-- Card 2: Decidir o passo -->
  <g class="sans">
    <rect x="334" y="96" width="250" height="160" rx="14" fill="#FFFFFF" stroke="#EADFE1" stroke-width="1.5" filter="url(#cardshadow)"/>
    <circle cx="366" cy="130" r="17" fill="url(#red2)"/>
    <text x="366" y="137" class="num" font-size="18" text-anchor="middle">2</text>
    <text x="396" y="137" class="title" font-size="20">Decidir o passo</text>
    <path d="M536 122 h22 M536 130 h22 M536 138 h14" stroke="#E3B8BF" stroke-width="2" stroke-linecap="round"/>
    <text x="358" y="178" class="body" font-size="15">A receita daquela tela</text>
    <text x="358" y="200" class="body" font-size="15">diz o que fazer agora</text>
    <text x="358" y="222" class="body" font-size="15">e o que esperar depois.</text>
  </g>

  <!-- Card 3: Agir -->
  <g class="sans">
    <rect x="618" y="96" width="250" height="160" rx="14" fill="#FFFFFF" stroke="#EADFE1" stroke-width="1.5" filter="url(#cardshadow)"/>
    <circle cx="650" cy="130" r="17" fill="url(#red2)"/>
    <text x="650" y="137" class="num" font-size="18" text-anchor="middle">3</text>
    <text x="680" y="137" class="title" font-size="20">Agir</text>
    <path d="M832 116 l0 18 l5 -5 l3 7 l3 -1 l-3 -7 l7 0 z" fill="#D10524"/>
    <path d="M846 116 a8 8 0 0 1 6 6" fill="none" stroke="#E3B8BF" stroke-width="2" stroke-linecap="round"/>
    <text x="642" y="178" class="body" font-size="15">Clica, digita, navega</text>
    <text x="642" y="200" class="body" font-size="15">menus e confirma &#8212;</text>
    <text x="642" y="222" class="body" font-size="15">como uma pessoa faria.</text>
  </g>

  <!-- Card 4: Conferir -->
  <g class="sans">
    <rect x="902" y="96" width="250" height="160" rx="14" fill="#FFFFFF" stroke="#EADFE1" stroke-width="1.5" filter="url(#cardshadow)"/>
    <circle cx="934" cy="130" r="17" fill="url(#red2)"/>
    <text x="934" y="137" class="num" font-size="18" text-anchor="middle">4</text>
    <text x="964" y="137" class="title" font-size="20">Conferir</text>
    <path d="M1118 115 l10 3 v8 c0 6 -5 10 -10 12 c-5 -2 -10 -6 -10 -12 v-8 z" fill="none" stroke="#E3B8BF" stroke-width="2" stroke-linejoin="round"/>
    <path d="M1113 127 l3 3 l6 -6" fill="none" stroke="#3AA76D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="926" y="178" class="body" font-size="15">Espera o sistema, valida</text>
    <text x="926" y="200" class="body" font-size="15">que deu certo e segue</text>
    <text x="926" y="222" class="body" font-size="15">(ou avisa no Telegram).</text>
  </g>

  <!-- loop back -->
  <path d="M1027 256 v16 h-854 v-10" fill="none" stroke="#D7B8BF" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M173 258 l-5 8 h10 z" fill="#D7B8BF"/>
  <text x="600" y="290" class="sans body" font-size="13" fill="#B89AA0" text-anchor="middle">o ciclo se repete a cada passo, em cada tela</text>

  <text x="48" y="330" class="sans body" font-size="13" fill="#9A8A8D">O ERP &#233; .NET + WinDev e n&#227;o exp&#245;e API &#8212; por isso o rob&#244; trabalha pela interface, como uma pessoa faria.</text>
</svg>
